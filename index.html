<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完全決着！辛口パスワード診断</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; max-width: 500px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h1 { font-size: 20px; text-align: center; color: #ff6b6b; margin-bottom: 20px; }
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
    button { padding: 12px 16px; border: none; background: #ff6b6b; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #ff5252; }
    
    .chat-box { background: #000; height: 350px; border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border: 1px solid #333; margin-bottom: 15px; }
    .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.4; word-break: break-all; font-size: 14px; }
    .ai { background: #2a2a2a; color: #ff8e8e; align-self: flex-start; border-bottom-left-radius: 0; }
    .user { background: #ff6b6b; color: #fff; align-self: flex-end; border-bottom-right-radius: 0; }
    .user-rebuttal { background: #3b82f6; color: #fff; align-self: flex-end; border-bottom-right-radius: 0; }
    .win { background: #22c55e; color: #fff; align-self: center; text-align: center; width: 100%; font-weight: bold; }
    .lose { background: #ef4444; color: #fff; align-self: center; text-align: center; width: 100%; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>完全決着・辛口パスワード診断</h1>
    
    <div class="chat-box" id="chat">
      <div class="msg ai">システム：パスワードを入力しやがれください。どちらかが折れるまで終わらないレスバを開始します。</div>
    </div>

    <div class="input-group" id="pw-area">
      <input type="text" id="pw" placeholder="パスワードを入力...">
      <button onclick="diagnose()">診断</button>
    </div>

    <div class="input-group" id="rebuttal-area" style="display: none;">
      <input type="text" id="rebuttal" placeholder="言い返す...">
      <button onclick="sendRebuttal()">反論！</button>
    </div>
  </div>

  <script>
    let currentPw = "";
    let turnCount = 0;
    let isGameOver = false;

    function addMsg(text, type) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function diagnose() {
      const input = document.getElementById('pw');
      currentPw = input.value;
      if (!currentPw) return;

      addMsg(`診断対象: ${currentPw}`, 'user');
      input.value = '';

      let reply = "なんか中途半端でダサいパスワードですね。攻撃する価値すら見出せません。";

      setTimeout(() => {
        addMsg(reply, 'ai');
        document.getElementById('pw-area').style.display = 'none';
        document.getElementById('rebuttal-area').style.display = 'flex';
      }, 400);
    }

    function sendRebuttal() {
      if (isGameOver) return;

      const input = document.getElementById('rebuttal');
      const text = input.value;
      if (!text) return;

      addMsg(text, 'user-rebuttal');
      input.value = '';
      turnCount++;

      let reply = "";
      const t = text.toLowerCase();

      // ユーザーが強力な一撃（論理破綻の指摘や特大の煽り、あるいは長引いた場合）を浴びせた場合の勝利判定
      if (t.includes("admin") || t.includes("プロスペクト") || t.includes("神奈川") || t.includes("警察") || turnCount >= 7) {
        isGameOver = true;
        setTimeout(() => {
          addMsg("ぐっ……！ そんな鋭い返しをされるとは想定していませんでした……。私の完敗です。もう二度とあなたのパスワードをダサいなんて言いません……っ！", 'ai');
          addMsg("【判定：あなたの完全勝利（AIの屈服）】", 'win');
          document.getElementById('rebuttal-area').style.display = 'none';
        }, 600);
        return;
      }

      // ユーザーがメンタルを折られそうな場合のAI勝利判定（特定の雑な返しや、ターン数が浅い時）
      if (t.length < 3 || t.includes("うるさい") || t.includes("もういい") && turnCount < 3) {
        isGameOver = true;
        setTimeout(() => {
          addMsg("フッ、その程度の語彙力で私に勝てると思ったのですか？ やはりあなたのセキュリティ意識と同様、メンタルもザルでしたね。私の圧倒的勝利です！", 'ai');
          addMsg("【判定：AIの完全勝利（あなたの精神的敗北）】", 'lose');
          document.getElementById('rebuttal-area').style.display = 'none';
        }, 600);
        return;
      }

      // 通常の泥沼ループ
      const randoms = [
        "論点をずらさないでいただけますか？パスワードがダサい話をしてるんです。",
        "そうやって感情的になるのが一番のセキュリティホールですよ。",
        "ふ〜ん、で？破られたら責任取れるんですか？（笑）",
        "その程度で勝った気でいるんですか？まだこっちは余裕ですが。"
      ];
      reply = randoms[Math.floor(Math.random() * randoms.length)];

      setTimeout(() => {
        addMsg(reply, 'ai');
      }, 600);
    }
  </script>
</body>
</html>
